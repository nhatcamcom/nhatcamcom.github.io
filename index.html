<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140f2e">
  <meta name="description" content="Ôn thi trắc nghiệm Mạng máy tính: 91 câu, 4 phần, chấm điểm và xem lại câu sai.">
  <title>Ôn thi Mạng máy tính</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M32 20v10M20 42l12-12 12 12'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Ccircle cx='32' cy='17' r='6'/%3E%3Ccircle cx='18' cy='45' r='6'/%3E%3Ccircle cx='46' cy='45' r='6'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bộ icon SVG dùng lại nhiều lần -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c.6 3.2 4.8 5.6 4.8 10.6A4.8 4.8 0 0 1 12 18a4.8 4.8 0 0 1-4.8-4.9c0-2 1-3.4 2.2-4.6.2 1.6 1 2.6 2 3 0-3 .2-6 .6-9z" fill="currentColor"/><path d="M12 21.5c-3.9 0-7-2.9-7-6.6 0-1.4.4-2.7 1.1-3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h11V9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <main class="app">
    <!-- ============ MÀN HÌNH BẮT ĐẦU ============ -->
    <section class="screen screen-start" id="screen-start" aria-labelledby="app-title">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M32 20v10M20 42l12-12 12 12"/></g><g fill="currentColor"><circle cx="32" cy="17" r="6"/><circle cx="18" cy="45" r="6"/><circle cx="46" cy="45" r="6"/></g></svg>
        </div>
        <div>
          <h1 id="app-title">Ôn thi Mạng máy tính</h1>
          <p class="brand-sub"><span id="total-count">91</span> câu trắc nghiệm · <span id="part-count">4</span> phần</p>
        </div>
      </header>

      <div class="panel setup">
        <fieldset class="field">
          <legend class="field-label">Chọn phần ôn</legend>
          <div class="part-grid" id="part-grid"></div>
        </fieldset>

        <fieldset class="field">
          <legend class="field-label">Số câu mỗi lượt</legend>
          <div class="seg" id="count-seg"></div>
        </fieldset>

        <div class="field toggles">
          <label class="toggle">
            <input type="checkbox" id="opt-shuffle-q">
            <span class="switch" aria-hidden="true"></span>
            <span class="toggle-text">Xáo trộn câu hỏi</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="opt-shuffle-a">
            <span class="switch" aria-hidden="true"></span>
            <span class="toggle-text">Xáo trộn đáp án</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="opt-timer">
            <span class="switch" aria-hidden="true"></span>
            <span class="toggle-text">Hẹn giờ <span class="muted" id="timer-label">30 giây/câu</span></span>
          </label>
        </div>

        <p class="last-result" id="last-result" hidden></p>

        <button type="button" class="btn btn-primary btn-lg btn-block" id="btn-start">
          <span>Bắt đầu · <span id="start-count">20</span> câu</span>
          <svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg>
        </button>
      </div>

      <p class="hint hide-touch">Mẹo: bấm phím <kbd>1</kbd>–<kbd>4</kbd> hoặc <kbd>A</kbd>–<kbd>D</kbd> để chọn, <kbd>Enter</kbd> để qua câu.</p>
    </section>

    <!-- ============ MÀN HÌNH LÀM BÀI ============ -->
    <section class="screen screen-quiz" id="screen-quiz" hidden aria-label="Làm bài">
      <header class="quiz-bar">
        <button type="button" class="icon-btn" id="btn-quit" aria-label="Thoát bài">
          <svg class="ic" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
        <div class="progress" role="progressbar" aria-label="Tiến độ" aria-valuemin="0" id="progress">
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <span class="progress-text"><b id="q-pos">1</b>/<span id="q-total">20</span></span>
        </div>
        <div class="pills">
          <span class="pill pill-streak" id="pill-streak" title="Chuỗi trả lời đúng liên tiếp">
            <svg class="ic" aria-hidden="true"><use href="#i-flame"/></svg><b id="streak-n">0</b>
          </span>
          <span class="pill pill-score" title="Số câu đúng">
            <svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><b id="score-n">0</b>
          </span>
        </div>
      </header>

      <div class="timer" id="timer" hidden>
        <svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg>
        <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
        <span class="timer-text" id="timer-text">30</span>
      </div>

      <article class="question-card" id="question-card">
        <p class="q-meta" id="q-meta"></p>
        <h2 class="q-text" id="q-text" tabindex="-1"></h2>
      </article>

      <div class="answers" id="answers" role="group" aria-label="Các đáp án"></div>
    </section>

    <!-- ============ MÀN HÌNH KẾT QUẢ ============ -->
    <section class="screen screen-result" id="screen-result" hidden aria-labelledby="result-title">
      <div class="panel result-hero">
        <div class="ring" id="ring" style="--p:0">
          <div class="ring-inner">
            <span class="ring-value" id="r-percent">0%</span>
            <span class="ring-label">chính xác</span>
          </div>
        </div>
        <div class="result-text">
          <h2 id="result-title">Hoàn thành!</h2>
          <p class="result-sub" id="result-sub"></p>
        </div>
        <dl class="stats">
          <div class="stat stat-ok"><dt>Đúng</dt><dd id="r-correct">0</dd></div>
          <div class="stat stat-bad"><dt>Sai</dt><dd id="r-wrong">0</dd></div>
          <div class="stat"><dt>Chuỗi dài nhất</dt><dd id="r-streak">0</dd></div>
          <div class="stat"><dt>Thời gian</dt><dd id="r-time">0:00</dd></div>
        </dl>
        <div class="result-actions">
          <button type="button" class="btn btn-primary" id="btn-retry-wrong">
            <svg class="ic" aria-hidden="true"><use href="#i-retry"/></svg>
            <span>Làm lại <span id="wrong-count">0</span> câu sai</span>
          </button>
          <button type="button" class="btn btn-ghost" id="btn-again">
            <svg class="ic" aria-hidden="true"><use href="#i-retry"/></svg>
            Làm lượt mới
          </button>
          <button type="button" class="btn btn-ghost" id="btn-home">
            <svg class="ic" aria-hidden="true"><use href="#i-home"/></svg>
            Về trang đầu
          </button>
        </div>
      </div>

      <div class="review">
        <div class="review-head">
          <h3>Xem lại</h3>
          <div class="seg seg-sm" id="review-seg">
            <button type="button" class="seg-btn" data-filter="wrong" aria-pressed="true">Câu sai</button>
            <button type="button" class="seg-btn" data-filter="all" aria-pressed="false">Tất cả</button>
          </div>
        </div>
        <ol class="review-list" id="review-list"></ol>
      </div>
    </section>
  </main>

  <!-- Thanh phản hồi đúng/sai: đặt ngoài <main> để luôn dính đáy màn hình -->
  <div class="feedback" id="feedback" hidden>
    <div class="feedback-inner">
      <div class="feedback-icon" aria-hidden="true"><svg class="ic"><use id="fb-icon" href="#i-check"/></svg></div>
      <div class="feedback-msg" role="status" aria-live="polite">
        <strong id="fb-title"></strong>
        <span id="fb-detail"></span>
      </div>
      <button type="button" class="btn btn-light" id="btn-next">
        <span id="btn-next-label">Câu tiếp</span>
        <svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg>
      </button>
    </div>
  </div>

  <dialog class="dialog" id="quit-dialog" aria-labelledby="quit-title">
    <form method="dialog">
      <h3 id="quit-title">Thoát bài đang làm?</h3>
      <p>Kết quả của lượt này sẽ không được lưu.</p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="stay" autofocus>Làm tiếp</button>
        <button class="btn btn-danger" value="quit">Thoát</button>
      </div>
    </form>
  </dialog>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
